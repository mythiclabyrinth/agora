<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<script>
// Apply the saved preference before CSS/React loads to avoid a theme flash.
try {
  const preference = localStorage.getItem('agora_appearance');
  const theme = preference === 'light' || (preference === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.colorScheme = theme;
} catch (_) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<title>Agora</title>
</head>
<body class="page-agora">
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
