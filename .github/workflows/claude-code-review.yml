# Automated, read-only Claude review for trusted pull requests.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
# - CLAUDE_CODE_OAUTH_TOKEN: a Claude Code OAuth token generated locally with
#   `claude setup-token`. Never generate it or perform browser login in CI.
#
# GitHub operations authenticate via the Claude GitHub App
# (https://github.com/apps/claude), which must be installed on this repo: the
# action exchanges the workflow's OIDC token for an app installation token.
# Don't pass `github_token` — comments would post as github-actions[bot],
# which the sticky-comment lookup can't recognize, so every push would create
# a new review comment instead of updating the existing one.
#
# Fork PRs and PRs from untrusted authors are intentionally excluded. GitHub does
# not expose repository secrets to forked pull_request workflows, and running an
# authenticated agent over untrusted content increases prompt-injection risk.

name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.title, '[WIP]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      # Persist GITHUB_TOKEN so claude-code-action can `git fetch` the PR
      # branch. It does that before configuring its own git auth, so
      # persist-credentials: false fails with "could not read Username for
      # 'https://github.com'". The token is contents:read only; this job
      # already skips forks and untrusted authors.
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # The Claude action validates workflow configuration against the default
      # branch. Skip execution when this workflow itself changes; review it after
      # merge on a subsequent PR instead.
      - name: Detect workflow self-change
        id: self-change
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflowPath = '.github/workflows/claude-code-review.yml';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const changed = files.some(({ filename }) => filename === workflowPath);
            core.setOutput('changed', changed ? 'true' : 'false');
            if (changed) {
              core.notice(`${workflowPath} changed; skipping Claude review until the workflow is on the default branch.`);
            }

      - name: Run Claude Code review
        if: steps.self-change.outputs.changed != 'true'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          track_progress: true
          use_sticky_comment: true
          show_full_output: false
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
          prompt: >-
            /code-review --comment. Review only: do not edit files, create commits,
            or push changes. Prioritize correctness, security, regressions,
            reliability, and missing tests. Keep findings concrete and actionable;
            include file and line references, and avoid low-value style comments.

      - name: Explain self-change skip
        if: steps.self-change.outputs.changed == 'true'
        run: echo "Claude review skipped because this PR modifies the review workflow itself."
