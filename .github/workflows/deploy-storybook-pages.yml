name: Deploy Agora Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-docs.mjs"
      - "scripts/docs-site/**"
      - ".github/workflows/deploy-storybook-pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build Storybook
        run: npm run build-storybook -w web
      - name: Assemble docs site and Storybook
        run: |
          node scripts/build-docs.mjs --out _site --flavor pages
          cp -a web/public/docs/coding-agents _site/coding-agents
          cp -a web/public/docs/agents/. _site/agents/
          mkdir -p _site/storybook
          cp -a web/storybook-static/. _site/storybook/
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Agora Pages
        id: deployment
        uses: actions/deploy-pages@v4
