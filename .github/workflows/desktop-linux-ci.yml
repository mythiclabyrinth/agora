# Proves the Linux packages before a release bump is merged. Updater artifacts
# are disabled here because CI does not publish and should not require the
# private updater signing key.
name: Linux desktop CI

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/agora-desktop/**"
      - "crates/agora-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-linux-ci.yml"
      - ".github/workflows/release-desktop.yml"
  workflow_dispatch: {}

concurrency:
  group: desktop-linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build bundled web UI
        run: npm run build
      - name: Test core and desktop shell
        run: cargo test -p agora-core -p agora-desktop
      - name: Build deb and AppImage packages
        working-directory: crates/agora-desktop
        run: >-
          npx @tauri-apps/cli@2 build
          --bundles deb,appimage
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: agora-linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
